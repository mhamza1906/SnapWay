<div class="entry">
  <header class="entry-header">
    <a class="entry-brand" routerLink="/map"
      ><span><app-icon name="route" /></span>snapway.</a
    >
    <h1 class="header-title">One account.<br /><span>Two ways to find your place.</span></h1>
  </header>
  <main class="entry-main">
    <div class="experience-cards" [attr.aria-busy]="auth.busy()">
      <button
        class="experience developer"
        (click)="choose('developer')"
        [disabled]="loading() || !enabled() || auth.busy()"
        aria-label="Sign in as Developer with Google"
      >
        <div class="card-copy">
          <span class="card-category">FOR THE PLACE MAKERS <span>01 /</span></span>
          <h2>Make places<br />make sense.</h2>
          <p>Map the details. Connect the dots.<br />Help everyone find a better way.</p>
          <span class="card-action"
            >{{ selected() === 'developer' ? 'Connecting to Google…' : 'Sign in as Developer'
            }}<span class="action-arrow"><app-icon name="arrow-right" /></span
          ></span>
        </div>
        <div class="illustration" aria-hidden="true">
          <svg class="map-art" viewBox="0 0 440 250" fill="none">
            <defs>
              <pattern id="entry-grid" width="20" height="20" patternUnits="userSpaceOnUse">
                <circle cx="1" cy="1" r="1" fill="currentColor" opacity=".13" />
              </pattern>
            </defs>
            <rect x="0" y="0" width="440" height="250" fill="url(#entry-grid)" />
            <g class="floor-plan" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
              <path d="M54 59H176V39H354V192H264V215H91V174H54Z" fill="#fff9f5" fill-opacity=".7" />
              <path
                d="M54 103H131V59M54 151H131V128M91 174H159V215M176 39V99H226V39M270 39V99H354M309 99V150H354M264 192V150H214V215M131 103H176M159 174V128H214M270 150V126"
              />
              <path
                d="M131 103V117M176 99V116M226 99H245M264 150H283"
                stroke-dasharray="3 5"
                opacity=".25"
              />
            </g>
            <g class="route-lines" stroke="#a7424f" stroke-width="3" stroke-linecap="round">
              <path class="route-edge edge-a" pathLength="1" d="M91 128H177V128H246V72" />
              <path class="route-edge edge-b" pathLength="1" d="M177 128V191" />
              <path class="route-edge edge-c" pathLength="1" d="M246 128H326" />
            </g>
            <g fill="#a7424f" stroke="#fff6f2" stroke-width="4">
              <circle class="map-node node-a" cx="91" cy="128" r="7" />
              <circle class="map-node node-b" cx="177" cy="128" r="7" />
              <circle class="map-node node-c" cx="246" cy="72" r="7" />
              <circle class="map-node node-d" cx="177" cy="191" r="7" />
              <circle class="map-node node-e" cx="326" cy="128" r="7" />
            </g>
            <g class="drawing-tag">
              <rect x="277" y="201" width="129" height="30" rx="15" fill="#fff9f5" />
              <circle cx="295" cy="216" r="3" fill="#a7424f" />
              <text
                x="306"
                y="220"
                fill="#84434b"
                font-size="10"
                font-family="sans-serif"
                letter-spacing="1"
              >
                IDEAS → PATHS
              </text>
            </g>
          </svg>
        </div>
      </button>
      <button
        class="experience public"
        (click)="choose('public')"
        [disabled]="loading() || !enabled() || auth.busy()"
        aria-label="Sign in as Public User with Google"
      >
        <div class="card-copy">
          <span class="card-category">FOR THE EVERYDAY EXPLORERS <span>02 /</span></span>
          <h2>A little less lost.<br />A lot more here.</h2>
          <p>See familiar landmarks. Follow your path.<br />Feel at home somewhere new.</p>
          <span class="card-action"
            >{{ selected() === 'public' ? 'Connecting to Google…' : 'Sign in as Public User'
            }}<span class="action-arrow"><app-icon name="arrow-right" /></span
          ></span>
        </div>
        <div class="illustration" aria-hidden="true">
          <img
            class="camera-scene"
            src="assets/navigation-camera.svg"
            alt=""
            width="640"
            height="340"
          />
        </div>
      </button>
    </div>
    <div class="connection-status" aria-live="polite">
      @if (loading()) {
        <p>Checking Google sign-in…</p>
      }
      @if (error() || auth.error()) {
        <p role="alert">
          {{ auth.error() || error() }} <button class="retry" (click)="load()">Try again</button>
        </p>
      }
      @if (!loading() && !enabled() && !error()) {
        <p>Google sign-in is currently unavailable. Please try again later.</p>
      }
    </div>
  </main>
</div>
