<svg
  class="graph-svg"
  [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
  role="group"
  aria-label="Map graph canvas"
  (click)="onBackground($event)"
>
  @if (underlayUrl(); as url) {
    <image [attr.href]="url" x="0" y="0" [attr.width]="width()" [attr.height]="height()" />
  } @else {
    <rect [attr.width]="width()" [attr.height]="height()" fill="#f5f6ef" />
    <text
      [attr.x]="width() / 2"
      [attr.y]="height() / 2"
      text-anchor="middle"
      fill="#8c9d89"
      font-size="22"
    >
      Upload a floor plan to start
    </text>
  }

  @for (path of paths(); track path.edge.id) {
    @if (path.start && path.end) {
      <line
        class="edge"
        role="button"
        tabindex="0"
        [attr.aria-label]="'Connection weight ' + path.edge.cost"
        (keydown.enter)="edgeClicked.emit(path.edge.id)"
        [class.selected]="path.edge.id === selectedEdgeId()"
        [attr.x1]="path.start.x"
        [attr.y1]="path.start.y"
        [attr.x2]="path.end.x"
        [attr.y2]="path.end.y"
        (click)="onEdge($event, path.edge.id)"
      />
    }
  }

  @for (node of nodes(); track node.id) {
    <g
      class="node"
      role="button"
      tabindex="0"
      [attr.aria-label]="'Waypoint: ' + (node.label || 'Unlabeled')"
      (keydown.enter)="nodeClicked.emit(node.id)"
      [class.selected]="node.id === selectedNodeId()"
      [class.connect-from]="node.id === connectFromId()"
      (click)="onNode($event, node.id)"
    >
      <circle [attr.cx]="node.x" [attr.cy]="node.y" r="10" />
      @if (node.label) {
        <text [attr.x]="node.x" [attr.y]="node.y - 16">{{ node.label }}</text>
      }
    </g>
  }
</svg>
