<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" fill="none">
  <defs>
    <linearGradient id="wallL" x1="45" y1="170" x2="285" y2="170" gradientUnits="userSpaceOnUse"><stop stop-color="#b7bcb0"/><stop offset="1" stop-color="#edece1"/></linearGradient>
    <linearGradient id="wallR" x1="355" y1="170" x2="598" y2="170" gradientUnits="userSpaceOnUse"><stop stop-color="#efeee5"/><stop offset="1" stop-color="#a6afa1"/></linearGradient>
    <linearGradient id="ceiling" x1="320" y1="29" x2="320" y2="142" gradientUnits="userSpaceOnUse"><stop stop-color="#c9cfc0"/><stop offset="1" stop-color="#eef0e5"/></linearGradient>
    <linearGradient id="floor" x1="320" y1="180" x2="320" y2="319" gradientUnits="userSpaceOnUse"><stop stop-color="#b3b8a7"/><stop offset=".45" stop-color="#e2e0cf"/><stop offset="1" stop-color="#bbbca8"/></linearGradient>
    <linearGradient id="glass" x1="90" y1="100" x2="185" y2="237" gradientUnits="userSpaceOnUse"><stop stop-color="#6b8581"/><stop offset=".4" stop-color="#a7b9ad"/><stop offset=".43" stop-color="#c3cfc0"/><stop offset="1" stop-color="#7c9489"/></linearGradient>
    <linearGradient id="glassR" x1="477" y1="121" x2="558" y2="243" gradientUnits="userSpaceOnUse"><stop stop-color="#7c9286"/><stop offset=".5" stop-color="#b0c0ac"/><stop offset="1" stop-color="#607d73"/></linearGradient>
    <linearGradient id="door" x1="300" y1="137" x2="334" y2="202" gradientUnits="userSpaceOnUse"><stop stop-color="#8f9c84"/><stop offset="1" stop-color="#60765e"/></linearGradient>
    <linearGradient id="coat" x1="426" y1="165" x2="464" y2="230" gradientUnits="userSpaceOnUse"><stop stop-color="#5a6861"/><stop offset=".5" stop-color="#364c43"/><stop offset="1" stop-color="#293f36"/></linearGradient>
    <linearGradient id="skin" x1="437" y1="142" x2="451" y2="164" gradientUnits="userSpaceOnUse"><stop stop-color="#c3b49b"/><stop offset="1" stop-color="#968e78"/></linearGradient>
    <linearGradient id="screen" x1="36" y1="0" x2="600" y2="330" gradientUnits="userSpaceOnUse"><stop stop-color="#fdfef7"/><stop offset="1" stop-color="#f2f4e9"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="55" gradientUnits="userSpaceOnUse"><stop stop-color="#acd8ac" stop-opacity="0"/><stop offset="1" stop-color="#d3ffbb" stop-opacity=".18"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#fffef1" stop-opacity=".7"/><stop offset="1" stop-color="#fffef1" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="cameraClip"><rect x="34" y="23" width="572" height="291" rx="13"/></clipPath>
  </defs>
  <style>
    .scan { animation: sweep 5s ease-in-out infinite; }
    .detection { animation: acquire 5s ease-in-out infinite; }
    .progress { stroke-dasharray:140; animation: tracking 5s ease-in-out infinite; }
    @keyframes sweep { 0%,100%{transform:translateY(0);opacity:0} 12%{opacity:1} 65%{transform:translateY(245px);opacity:1} 80%{transform:translateY(245px);opacity:0} }
    @keyframes acquire { 0%,20%,100%{opacity:.12} 45%,85%{opacity:1} }
    @keyframes tracking { 0%,15%{stroke-dashoffset:140} 70%,100%{stroke-dashoffset:0} }
    @media(prefers-reduced-motion:reduce){.scan,.detection,.progress{animation:none}.scan{opacity:.25}.progress{stroke-dashoffset:0}}
  </style>
  <!-- A vector-built camera view: geometry and shading remain resolution independent. -->
  <rect x="21" y="9" width="598" height="319" rx="25" fill="url(#screen)" stroke="#b9c7ae"/>
  <g clip-path="url(#cameraClip)">
    <rect x="34" y="23" width="572" height="291" fill="#d5d9cc"/>
