<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SnapWay walking map</title>
    <style nonce="{{ nonce }}">
      html, body, #map { width:100%; height:100%; margin:0; background:#eceee9; }
      #status { position:absolute; inset:0; display:grid; place-items:center; padding:24px; font:16px system-ui; text-align:center; color:#305a45; }
      #status[hidden] { display:none; }
    </style>
  </head>
  <body>
    <div id="map" aria-label="Google map for walking"></div>
    <div id="status" role="status">Opening your map…</div>
    {{ map_config|json_script:"map-config" }}
    <script nonce="{{ nonce }}">
      (() => {
        'use strict';
        const config = JSON.parse(document.getElementById('map-config').textContent);
        const channel = location.hash.slice(1);
        const allowed = new Set(['capacitor://localhost', 'https://localhost', 'http://localhost', location.origin]);
        let parentOrigin = null, map = null, maps = null, user = null, target = null;
        let latest = { location:null, destination:null };
        const send = (type, detail) => {
          if (parentOrigin) parent.postMessage({ type, channel, detail }, parentOrigin);
        };
        const fail = () => {
          document.getElementById('status').hidden = false;
          document.getElementById('status').textContent = 'Google Maps is unavailable. You can still choose an indoor destination.';
          send('snapway.map.error');
        };
        const coordinate = value => value == null || (
          typeof value.lat === 'number' && Number.isFinite(value.lat) && Math.abs(value.lat) <= 90 &&
          typeof value.lng === 'number' && Number.isFinite(value.lng) && Math.abs(value.lng) <= 180
        );
        const pin = (old, position, title) => {
          if (!position) { if (old) old.map = null; return null; }
          if (old) { old.position = position; return old; }
          return new maps.marker.AdvancedMarkerElement({map, position, title});
        };
        const update = () => {
          if (!map) return;
          user = pin(user, latest.location, 'Your approximate location');
          target = pin(target, latest.destination, 'Building entrance');
          if (latest.location && latest.destination) {
            const bounds = new maps.LatLngBounds();
            bounds.extend(latest.location); bounds.extend(latest.destination); map.fitBounds(bounds, 64);
          } else if (latest.location || latest.destination) map.panTo(latest.location || latest.destination);
        };
        addEventListener('message', event => {
          if (event.source !== parent || !allowed.has(event.origin) || !event.data || event.data.channel !== channel) return;
          const value = event.data;
          if (value.type !== 'snapway.map.update' || !coordinate(value.location) || !coordinate(value.destination)) return;
          parentOrigin = event.origin;
          latest = { location:value.location || null, destination:value.destination || null };
          update();
          if (map) send('snapway.map.ready');
        });
        window.gm_authFailure = fail;
        window.snapwayMapReady = async () => {
          try {
            maps = google.maps;
            await Promise.all([maps.importLibrary('maps'), maps.importLibrary('marker')]);
            map = new maps.Map(document.getElementById('map'), {
              center: latest.location || latest.destination || {lat:43.6532,lng:-79.3832}, zoom:17,
              mapId:config.mapId, disableDefaultUI:true, zoomControl:true, clickableIcons:false
            });
            document.getElementById('status').hidden = true;
            update(); send('snapway.map.ready');
          } catch (_) { fail(); }
        };
        if (!config.key) { fail(); return; }
        const script = document.createElement('script');
        script.nonce = document.currentScript.nonce;
        script.src = 'https://maps.googleapis.com/maps/api/js?' + new URLSearchParams({key:config.key,v:'quarterly',loading:'async',callback:'snapwayMapReady'});
        script.async = true; script.onerror = fail; document.head.append(script);
      })();
    </script>
  </body>
</html>
